[SystemSettings]
; Lumen caches lighting pre-exposed: at 8 the daylight exposure (EV ~13) clipped the cache
; ("Cached lighting ... clipped, safe [-8, 12]") and dark rooms such as the fast-food interior
; came out black. 12 keeps day and interiors in range; measured at no GPU cost on the M1.
r.EyeAdaptation.CachedLightingPreExposure=12

