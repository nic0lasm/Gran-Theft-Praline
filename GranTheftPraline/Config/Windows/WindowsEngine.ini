[/Script/Engine.RendererSettings]
; Lumen traces with the GPU's ray tracing units on Windows (RTX class cards); the Mac keeps
; software Lumen. r.Lumen.HardwareRayTracing 0 on the command line gives the software path back.
r.Lumen.HardwareRayTracing=True
; Ultra on RTX cards (ADR-0002): MegaLights lights the night street, cheaper than classic
; shadowed lights on the V5 view (7.1 ms against 7.7 ms GPU). The Mac keeps classic lights.
r.MegaLights.EnableForProject=True

[SystemSettings]
; The automatic texture pool came out at about 2.2 GB on the RTX 3070 Ti (8 GB) and the slice
; went over it ("TEXTURE STREAMING POOL OVER BUDGET"). 3 GB leaves room for Lumen and Nanite;
; LimitPoolSizeToVRAM keeps smaller cards safe.
; Gate 76: with Lumen ray tracing, MegaLights and the flight's traffic, 3 GB left the card 58 MB
; short ("Video memory has been exhausted" from 170 s, GPU p95 78 ms in the GTARun pass).
; 2.75 GB gives that back with room to spare.
; Gate 91 (GPU memory profiled during the long take): the card still goes over its 7194 MB budget at 88 s
; and from 150 s, up to 7492 MB at 217 s, each time with a 60 to 110 ms frame; the pool is full
; and its cached mips reach 1.38 GB by 100 s. 2.375 GB takes 384 MB off, more than the 298 MB over.
r.Streaming.PoolSize=2432
r.Streaming.LimitPoolSizeToVRAM=1

[/Script/UdpMessaging.UdpMessagingSettings]
; The game needs no message bus (LiveLink brings UdpMessaging and TcpMessaging along). TcpMessaging
; listened on 0.0.0.0:1985 and made Windows open a firewall prompt for every new package path.
EnabledByDefault=False
EnableTransport=False

[/Script/TcpMessaging.TcpMessagingSettings]
EnableTransport=False
ListenEndpoint=
