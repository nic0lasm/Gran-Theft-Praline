[/Script/Engine.RendererSettings]
; Lumen traces with the GPU's ray tracing units on Windows (RTX class cards); the Mac keeps
; software Lumen. r.Lumen.HardwareRayTracing 0 on the command line gives the software path back.
r.Lumen.HardwareRayTracing=True

[SystemSettings]
; The automatic texture pool came out at about 2.2 GB on the RTX 3070 Ti (8 GB) and the slice
; went over it ("TEXTURE STREAMING POOL OVER BUDGET"). 3 GB leaves room for Lumen and Nanite;
; LimitPoolSizeToVRAM keeps smaller cards safe.
r.Streaming.PoolSize=3072
r.Streaming.LimitPoolSizeToVRAM=1
