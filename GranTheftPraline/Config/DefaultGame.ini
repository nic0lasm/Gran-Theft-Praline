[/Script/UnrealEd.ProjectPackagingSettings]
; Our player character and input, then the Game Animation Sample content they
; use (copied locally by tools/character/install_gasp_content.sh, not in Git).
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Player")
+DirectoriesToAlwaysCook=(Path="/Game/Input/GTP")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/UEFN_Mannequin")
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Levels/LevelPrototyping")
+DirectoriesToAlwaysCook=(Path="/Game/Misc")
; Generated street ambience (tools/audio), soft-referenced by the controller.
+DirectoriesToAlwaysCook=(Path="/Game/Sound")
; Test car spawned with -TestVehicle (loaded by path, so cook it explicitly).
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/Cars/Renault_ClioV")
; Day-night cycle and weather (GTPEnvironmentSubsystem): parameter collection, rain layer.
+DirectoriesToAlwaysCook=(Path="/Game/Environment/Weather")
; Night lights file read at run time (tools/environment/build_night_lights.py, not in Git).
+DirectoriesToAlwaysStageAsUFS=(Path="Environment/Data")

[/Script/GranTheftPraline.GTPEnvironmentSubsystem]
