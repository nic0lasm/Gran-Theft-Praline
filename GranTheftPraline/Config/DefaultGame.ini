[/Script/GranTheftPraline.GTPGraphicsProfile]
; Rendering profile applied at start (ADR-0002, docs/adr/adr-0002-performance-budget.md).
; -GfxProfile=ultra|fidelity|m1 overrides it. Same values as
; tools/rendering/reference_scene/profiles.json.
DefaultProfile=m1
+FidelityCVars=r.ScreenPercentage=67
+FidelityCVars=sg.ViewDistanceQuality=3
+FidelityCVars=sg.ShadowQuality=2
+FidelityCVars=sg.GlobalIlluminationQuality=2
+FidelityCVars=sg.ReflectionQuality=2
+FidelityCVars=sg.PostProcessQuality=3
+FidelityCVars=sg.TextureQuality=2
+FidelityCVars=sg.EffectsQuality=2
+FidelityCVars=sg.FoliageQuality=2
; m1 = fidelity + Lumen Lite + shadows Medium. Its screen percentage is
; computed so the internal image stays M1ScreenPercentage of M1ReferenceHeight.
+M1CVars=sg.GlobalIlluminationQuality=1
+M1CVars=sg.ReflectionQuality=1
+M1CVars=sg.ShadowQuality=1
M1ReferenceHeight=1080
M1ScreenPercentage=50

[/Script/GranTheftPraline.GTPGameMode]
