[/Script/GranTheftPraline.GTPTrafficNetwork]
; Cars with a driver on the lanes of the map; -Traffic=N overrides. Perceived traffic measured on M1
; (docs/performance/vehicle-cost.md section 6): 16 driven + 24 far cars = 40 in view, p95 28.2 ms.
NumCars=16
; Distance tiers, ghosts past 90 m and the car pool (sections 3 and 4): needed for 16 cars on M1.
bVehicleLod=True
bVehicleGhost=True
bTrafficPool=True
; Far traffic as puppet cars past the ghost distance (section 6); -FarTraffic=N overrides.
NumFarCars=24
; Parked cars stay off until the /Game/Vehicles/Parked meshes are right (-ParkedCars=1 to try).
bParkedCars=False
; Driven cars past 30 m drawn static: no skinning, no velocity pass (wheels still past 30 m).
; Measured 11/11 on the M1, 24 driven + 24 far, fixed camera: GPU p50 15.0 -> 12.3 ms. -CarRenderStatic=-1 turns it off.
StaticRenderDistance=3000.0
MinSpawnDistance=4000.0
MaxCarDistance=25000.0
StuckSeconds=35.0
