name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Check commit identities and tracked files
        run: tools/ci/provenance-check.sh

  city-tools:
    name: City tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/city/requirements.txt
      - name: Unit tests
        run: python -I -m unittest discover -s tools/city/tests
      - name: Unreal import script compiles
        run: python -m py_compile tools/city/unreal/import_city.py tools/city/unreal/place_facades.py tools/city/unreal/shoot_city.py tools/city/unreal/place_props.py tools/city/unreal/apply_city_materials.py tools/city/ground_mask.py tools/city/riverside.py tools/city/carriageway.py tools/city/cells.py tools/city/generate.py tools/city/terrain.py tools/city/props.py tools/city/details.py tools/city/brands.py tools/city/signs.py tools/city/facade_kit/kit.py tools/city/facade_kit/assemble.py

  assets-pipeline:
    name: Asset pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/assets/requirements.txt
      - name: Unit tests (preparation outside Unreal)
        run: python -m pytest tools/assets/tests -q
      - name: Unreal import script compiles
        run: python -m py_compile tools/assets/unreal/import_props.py
