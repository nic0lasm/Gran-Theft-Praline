name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Check commit identities and tracked files
        run: tools/ci/provenance-check.sh
      - name: No merge conflict markers left in the tree
        run: "! git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- GranTheftPraline tools docs .github ':!*.md'"

  city-tools:
    name: City tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/city/requirements.txt
      - name: Unit tests
        run: python -I -m unittest discover -s tools/city/tests
      - name: Test drive tools
        run: python -I -m unittest discover -s tools/test/tests && bash -n tools/test/run-drive.sh
      - name: Unreal import script compiles
        run: python -m py_compile tools/city/unreal/import_city.py tools/city/unreal/place_facades.py tools/city/unreal/shoot_city.py tools/city/unreal/place_props.py tools/city/unreal/merge_detail_materials.py tools/city/unreal/apply_city_materials.py tools/city/unreal/gtp_surfaces.py tools/city/unreal/import_surfaces.py tools/city/surfaces_build.py tools/city/surface_files.py tools/city/ground_mask.py tools/city/riverside.py tools/city/carriageway.py tools/city/parking.py tools/city/cells.py tools/city/cell_budget.py tools/city/landmarks.py tools/city/generate.py tools/city/terrain.py tools/city/props.py tools/city/details.py tools/city/clear_lanes.py tools/assets/make_broken.py tools/city/brands.py tools/city/signs.py tools/city/facade_kit/kit.py tools/city/facade_kit/roof_kit.py tools/city/facade_kit/haussmann.py tools/city/facade_kit/preview_stack.py tools/city/facade_kit/assemble.py tools/city/sign_atlas.py tools/city/cell_proxies.py tools/city/interior_cutouts.py tools/city/backdrop.py tools/city/unreal/probe_actors.py tools/city/unreal/fix_material_usage.py tools/city/quarter_build.py tools/city/route_dressing.py tools/city/route_trees.py tools/city/facade_tone.py tools/city/facade_preview.py tools/city/unreal/backdrop_collision.py tools/city/lane_clear.py tools/city/unreal/clear_lane_instances.py tools/city/pits.py tools/city/unreal/cover_pits.py tools/city/facade_flips.py tools/city/unreal/fix_facade_flips.py tools/city/zonegraph.py tools/city/unreal/place_zonegraph.py tools/city/flight_circuit.py
      - name: City cell streaming rules outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/city/tests/city_streaming_test.cpp -o city_streaming_test
          ./city_streaming_test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/city/tests/city_tuning_test.cpp -o city_tuning_test
          ./city_tuning_test

  assets-pipeline:
    name: Asset pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/assets/requirements.txt
      - name: Unit tests (preparation outside Unreal)
        run: python -m pytest tools/assets/tests -q
      - name: Unreal import script compiles
        run: python -m py_compile tools/assets/unreal/import_props.py
      - name: Environment tools tests (day-night and weather)
        run: python -m pytest tools/environment/tests -q
      - name: Environment Unreal script compiles
        run: python -m py_compile tools/environment/unreal/setup_environment.py tools/environment/unreal/gtp_weather.py tools/environment/environment_model.py

  wanted-rules:
    name: Wanted level rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build and run the wanted level test
        run: |
          g++ -O2 -std=c++17 -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/wanted_test.cpp -o /tmp/wanted_test
          /tmp/wanted_test
      - name: Roadblock placement rules
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/roadblock_test.cpp -o /tmp/roadblock_test
          /tmp/roadblock_test
      - name: Bend speed of the drive logic
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/bend_test.cpp -o /tmp/bend_test
          /tmp/bend_test
      - name: A car driven round a right angle with the chase settings
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/corner_drive_test.cpp -o /tmp/corner_drive_test
          /tmp/corner_drive_test
      - name: Chase speed of the drive logic (known path and bend horizon)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/chase_speed_test.cpp -o /tmp/chase_speed_test
          /tmp/chase_speed_test
      - name: Pursuit as the player sees it (police speed and distance)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/chase_tally_test.cpp -o /tmp/chase_tally_test
          /tmp/chase_tally_test
      - name: Police car held, off its wheels, steering and pedals
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/unit_recovery_test.cpp -o /tmp/unit_recovery_test
          /tmp/unit_recovery_test
          printf '#include "GTPUnitRecovery.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: Police car and officer round what stands in the way
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/unit_avoid_test.cpp -o /tmp/unit_avoid_test
          /tmp/unit_avoid_test
          printf '#include "GTPUnitAvoid.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: The way a chasing car takes on the lanes
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/lane_route_test.cpp -o /tmp/lane_route_test
          /tmp/lane_route_test
          printf '#include "GTPLaneRoute.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: The roads a flight takes (carriageway width, lanes that never end)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/road_width_test.cpp -o /tmp/road_width_test
          /tmp/road_width_test
          printf '#include "GTPRoadWidth.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: The circuit of a flight (rows, lap, approach, driving lines)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/flight_circuit_test.cpp -o /tmp/flight_circuit_test
          /tmp/flight_circuit_test
          printf '#include "GTPFlightCircuit.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: Witnesses of a crime
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/witness_test.cpp -o /tmp/witness_test
          /tmp/witness_test
      - name: Police unit states
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/brain_test.cpp -o /tmp/brain_test
          /tmp/brain_test
      - name: Police tactics rules
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/tactics_test.cpp -o /tmp/tactics_test
          /tmp/tactics_test
      - name: Ghost mode of far traffic cars
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/ghost_test/ghost_test.cpp -o /tmp/ghost_test
          /tmp/ghost_test
      - name: Build and run the traffic reactions test (horn, going round, panic, fleeing)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/react_test/react_test.cpp -o /tmp/react_test
          /tmp/react_test
          for h in GTPTrafficReactLogic GTPHornSynth; do
            printf '#include "%s.h"\nint main() { return 0; }\n' "$h" > /tmp/hdr.cpp
            clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
          done
      - name: Carjack victims, arcade driving help and driver temperaments
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/carjack_test/carjack_test.cpp -o /tmp/carjack_test
          /tmp/carjack_test
          printf '#include "GTPCarjackLogic.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: Car following (IDM)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/idm_test/idm_test.cpp -o /tmp/idm_test
          /tmp/idm_test
      - name: Crashes between traffic cars and arguing drivers
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/incident_test/incident_test.cpp -o /tmp/incident_test
          /tmp/incident_test
          printf '#include "GTPIncidentLogic.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: Far traffic drawn as instances
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/far_test/far_test.cpp -o /tmp/far_test
          /tmp/far_test
      - name: Mission parking spots
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/kerb_test/kerb_test.cpp -o /tmp/kerb_test
          /tmp/kerb_test

  mission-rules:
    name: Mission framework rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Mission tables and state machine outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/missions/mission_test/mission_test.cpp -o /tmp/mission_test
          /tmp/mission_test GranTheftPraline/Content/Data/Missions tools/missions/mission_test/fixtures

  combat-rules:
    name: Combat rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Health, damage, pistol, aim assist, fists and cover outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/combat/combat_logic_test.cpp -o /tmp/combat_logic_test
          /tmp/combat_logic_test
      - name: Unreal combat scripts compile
        run: python -m py_compile tools/combat/unreal/make_blood_material.py tools/combat/unreal/lyra_weapons_setup.py
      - name: Headers clean under strict conversion warnings (MSVC is stricter than g++)
        run: |
          for h in GTPHealthLogic GTPDamageLogic GTPWeaponLogic GTPCombatMeleeLogic GTPCoverLogic; do
            printf '#include "%s.h"\nint main() { return 0; }\n' "$h" > /tmp/hdr.cpp
            clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
          done

  ui-core:
    name: Interface core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mini-map data tool tests
        run: python -I -m unittest discover -s tools/ui/tests
      - name: String tables, settings and mini-map maths (C++, no Unreal)
        run: tools/ui/tests/run_cpp_tests.sh

  audio-tools:
    name: Audio tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - name: Unit tests (banks, surface map, recorded picks)
        run: python -I -m unittest discover -s tools/audio/tests
      - name: Car signal rules outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/environment/car_signals_test.cpp -o car_signals_test
          ./car_signals_test
      - name: Lens rules of the picture outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/environment/picture_lens_test.cpp -o picture_lens_test
          ./picture_lens_test
          printf '#include "GTPPictureLens.h"\nint main() { return 0; }\n' > /tmp/hdr.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
      - name: Footstep rules and procedural sirens outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/audio/audio_logic_test.cpp -o audio_logic_test
          mkdir -p synth-out
          ./audio_logic_test synth-out
          python -I tools/audio/check_synths.py synth-out
      - name: Unreal import scripts compile
        run: python -m py_compile tools/audio/unreal/import_sounds.py tools/audio/unreal/report_gasp_foley.py tools/audio/import_ambience.py tools/audio/analyze_audio_run.py tools/audio/make_ambiences.py tools/audio/zone_map.py tools/audio/pick_sonniss.py tools/audio/make_voices_ui.py tools/audio/make_weapons.py tools/audio/make_places.py && bash -n tools/audio/mac_audio_pass.sh

  qa-tools:
    name: QA tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (version stamp, archives, log and bundle checks)
        run: python -I -m unittest discover -s tools/qa/tests
      - name: Credits cover every licence family in assets/SOURCES.md
        run: python3 tools/qa/check_notices.py

  interiors:
    name: Reference interior rules and budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Till float, shift and multi-employee hold-up (C++, no Unreal)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/interiors/core_test/core_test.cpp -o /tmp/core_test
          /tmp/core_test
      - name: Layout generator tests
        run: python -I -m unittest discover -s tools/interiors/tests
      - name: Unreal interior level script compiles
        run: python -m py_compile tools/interiors/unreal/build_interior_level.py tools/interiors/unreal/map_interior_meshes.py tools/interiors/unreal/import_free_assets.py tools/interiors/unreal/shoot_interior.py tools/interiors/unreal/budget_interior_meshes.py
      - name: Object budget of the reference interior, M1 and PC
        run: |
          python -I tools/interiors/interior_layout.py tools/interiors/fastfood_bellecour.json --tier m1
          python -I tools/interiors/interior_layout.py tools/interiors/fastfood_bellecour.json --tier pc
