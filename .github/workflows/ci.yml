name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    name: Provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Check commit identities and tracked files
        run: tools/ci/provenance-check.sh

  city-tools:
    name: City tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/city/requirements.txt
      - name: Unit tests
        run: python -I -m unittest discover -s tools/city/tests
      - name: Test drive tools
        run: python -I -m unittest discover -s tools/test/tests && bash -n tools/test/run-drive.sh
      - name: Unreal import script compiles
        run: python -m py_compile tools/city/unreal/import_city.py tools/city/unreal/place_facades.py tools/city/unreal/shoot_city.py tools/city/unreal/place_props.py tools/city/unreal/merge_detail_materials.py tools/city/unreal/apply_city_materials.py tools/city/unreal/gtp_surfaces.py tools/city/unreal/import_surfaces.py tools/city/surfaces_build.py tools/city/surface_files.py tools/city/ground_mask.py tools/city/riverside.py tools/city/carriageway.py tools/city/parking.py tools/city/cells.py tools/city/cell_budget.py tools/city/landmarks.py tools/city/generate.py tools/city/terrain.py tools/city/props.py tools/city/details.py tools/assets/make_broken.py tools/city/brands.py tools/city/signs.py tools/city/facade_kit/kit.py tools/city/facade_kit/roof_kit.py tools/city/facade_kit/haussmann.py tools/city/facade_kit/preview_stack.py tools/city/facade_kit/assemble.py tools/city/sign_atlas.py tools/city/cell_proxies.py tools/city/interior_cutouts.py tools/city/backdrop.py tools/city/unreal/probe_actors.py tools/city/unreal/fix_material_usage.py tools/city/quarter_build.py
      - name: City cell streaming rules outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/city/tests/city_streaming_test.cpp -o city_streaming_test
          ./city_streaming_test
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/city/tests/city_tuning_test.cpp -o city_tuning_test
          ./city_tuning_test

  assets-pipeline:
    name: Asset pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/assets/requirements.txt
      - name: Unit tests (preparation outside Unreal)
        run: python -m pytest tools/assets/tests -q
      - name: Unreal import script compiles
        run: python -m py_compile tools/assets/unreal/import_props.py
      - name: Environment tools tests (day-night and weather)
        run: python -m pytest tools/environment/tests -q
      - name: Environment Unreal script compiles
        run: python -m py_compile tools/environment/unreal/setup_environment.py tools/environment/unreal/gtp_weather.py tools/environment/environment_model.py

  wanted-rules:
    name: Wanted level rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build and run the wanted level test
        run: |
          g++ -O2 -std=c++17 -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/wanted_test.cpp -o /tmp/wanted_test
          /tmp/wanted_test
      - name: Police tactics rules
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/wanted_sim/tactics_test.cpp -o /tmp/tactics_test
          /tmp/tactics_test
      - name: Ghost mode of far traffic cars
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/ghost_test/ghost_test.cpp -o /tmp/ghost_test
          /tmp/ghost_test
      - name: Build and run the traffic reactions test (horn, going round, panic, fleeing)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/react_test/react_test.cpp -o /tmp/react_test
          /tmp/react_test
          for h in GTPTrafficReactLogic GTPHornSynth; do
            printf '#include "%s.h"\nint main() { return 0; }\n' "$h" > /tmp/hdr.cpp
            clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
          done
      - name: Far traffic drawn as instances
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/far_test/far_test.cpp -o /tmp/far_test
          /tmp/far_test
      - name: Mission parking spots
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/vehicles/kerb_test/kerb_test.cpp -o /tmp/kerb_test
          /tmp/kerb_test

  mission-rules:
    name: Mission framework rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Mission tables and state machine outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/missions/mission_test/mission_test.cpp -o /tmp/mission_test
          /tmp/mission_test GranTheftPraline/Content/Data/Missions tools/missions/mission_test/fixtures

  combat-rules:
    name: Combat rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Health, damage, pistol, aim assist, fists and cover outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/combat/combat_logic_test.cpp -o /tmp/combat_logic_test
          /tmp/combat_logic_test
      - name: Unreal combat scripts compile
        run: python -m py_compile tools/combat/unreal/make_blood_material.py
      - name: Headers clean under strict conversion warnings (MSVC is stricter than g++)
        run: |
          for h in GTPHealthLogic GTPDamageLogic GTPWeaponLogic GTPCombatMeleeLogic GTPCoverLogic; do
            printf '#include "%s.h"\nint main() { return 0; }\n' "$h" > /tmp/hdr.cpp
            clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wdouble-promotion -I GranTheftPraline/Source/GranTheftPraline/Public /tmp/hdr.cpp
          done

  ui-core:
    name: Interface core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mini-map data tool tests
        run: python -I -m unittest discover -s tools/ui/tests
      - name: String tables, settings and mini-map maths (C++, no Unreal)
        run: tools/ui/tests/run_cpp_tests.sh

  audio-tools:
    name: Audio tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - name: Unit tests (banks, surface map, recorded picks)
        run: python -I -m unittest discover -s tools/audio/tests
      - name: Car signal rules outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/environment/car_signals_test.cpp -o car_signals_test
          ./car_signals_test
      - name: Footstep rules and procedural sirens outside Unreal
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/audio/audio_logic_test.cpp -o audio_logic_test
          mkdir -p synth-out
          ./audio_logic_test synth-out
          python -I tools/audio/check_synths.py synth-out
      - name: Unreal import scripts compile
        run: python -m py_compile tools/audio/unreal/import_sounds.py tools/audio/unreal/report_gasp_foley.py tools/audio/import_ambience.py tools/audio/analyze_audio_run.py tools/audio/make_ambiences.py tools/audio/zone_map.py tools/audio/pick_sonniss.py tools/audio/make_voices_ui.py tools/audio/make_weapons.py tools/audio/make_places.py && bash -n tools/audio/mac_audio_pass.sh

  qa-tools:
    name: QA tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (version stamp, archives, log and bundle checks)
        run: python -I -m unittest discover -s tools/qa/tests
      - name: Credits cover every licence family in assets/SOURCES.md
        run: python3 tools/qa/check_notices.py

  interiors:
    name: Reference interior rules and budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Till float, shift and multi-employee hold-up (C++, no Unreal)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -I GranTheftPraline/Source/GranTheftPraline/Public tools/interiors/core_test/core_test.cpp -o /tmp/core_test
          /tmp/core_test
      - name: Layout generator tests
        run: python -I -m unittest discover -s tools/interiors/tests
      - name: Unreal interior level script compiles
        run: python -m py_compile tools/interiors/unreal/build_interior_level.py tools/interiors/unreal/map_interior_meshes.py tools/interiors/unreal/import_free_assets.py tools/interiors/unreal/shoot_interior.py tools/interiors/unreal/budget_interior_meshes.py
      - name: Object budget of the reference interior, M1 and PC
        run: |
          python -I tools/interiors/interior_layout.py tools/interiors/fastfood_bellecour.json --tier m1
          python -I tools/interiors/interior_layout.py tools/interiors/fastfood_bellecour.json --tier pc
